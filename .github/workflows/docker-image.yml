name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Docker Login
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_PASS }}
        
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag samuelcv12/express-randomquotes:latest
      
    - name: Docker Push
      run: docker push samuelcv12/express-randomquotes:latest
